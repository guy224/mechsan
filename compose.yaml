services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    env_file: .env
    command: ["npm", "run", "worker"]
    restart: unless-stopped
